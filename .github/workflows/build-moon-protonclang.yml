name: Build MOON kernel PROTONCLANG - diagnostic

# 诊断用：只编纯 moon 内核（不加 KernelSU、不注入 hook），用来判断
#   - 若此包能开机 -> 说明公开 moon 源没问题，卡屏是我们的 KSU 集成导致
#   - 若此包也卡屏 -> 说明公开 moon 源与设备/ROM 不匹配
# 触发：push 到 vanilla 分支（或手动 workflow_dispatch）
# 产物：发布到 release-proton 分支的 zip

on:
  push:
    branches: [ protonclang ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_REPO: "https://github.com/bcggxx/android_kernel_xiaomi_moon_sm8250"
  KERNEL_BRANCH: "main"

jobs:
  build:
    name: Build moon VANILLA
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (workflow only)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip bc bison flex gperf \
            build-essential libssl-dev libelf-dev cpio lz4 lzop xz-utils \
            python3 python-is-python3 device-tree-compiler p7zip-full

      - name: Install proton-clang 20210522 (clang 12.0.0)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          wget -c -O proton.zip https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip -q proton.zip
          mv proton-clang-20210522 proton-clang
          echo "$GITHUB_WORKSPACE/proton-clang/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/proton-clang/bin/clang" --version | head -3

      - name: Clone moon kernel
        run: |
          set -e
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel && echo "kernel HEAD: $(git rev-parse HEAD)"; head -n 5 Makefile

      - name: Append moon xiaomi.config to defconfig (no KSU)
        working-directory: kernel
        run: |
          set -e
          DEF=arch/arm64/configs/vendor/pipa_user_defconfig
          cat arch/arm64/configs/xiaomi.config >> "$DEF"
          echo "--- tail defconfig ---"; tail -n 20 "$DEF"

      - name: Build & pack (moon build.sh + AnyKernel3)
        working-directory: kernel
        run: |
          set -e
          bash build.sh

      - name: Rename artifact
        working-directory: kernel
        run: |
          set -e
          f=$(ls Kernel_*.zip 2>/dev/null | head -n1)
          [ -n "$f" ] || { echo "no zip"; ls -la; exit 1; }
          mv "$f" "../moon-proton-${GITHUB_RUN_NUMBER}.zip"
          ls -la ../*.zip

      - name: Publish to release-proton branch
        if: success()
        run: |
          set +e
          mkdir -p /tmp/rel && cp moon-proton-*.zip /tmp/rel/
          cd /tmp/rel
          git init -q -b release-proton
          git config user.name ci; git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git -c commit.gpgsign=false commit -q -m "proton zip run ${{ github.run_number }}"
          git push -f origin release-proton
