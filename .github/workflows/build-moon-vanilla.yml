name: Build MOON kernel VANILLA (no KSU) - diagnostic

# 诊断用：只编纯 moon 内核（不加 KernelSU、不注入 hook），用来判断
#   - 若此包能开机 -> 说明公开 moon 源没问题，卡屏是我们的 KSU 集成导致
#   - 若此包也卡屏 -> 说明公开 moon 源与设备/ROM 不匹配
# 触发：push 到 vanilla 分支（或手动 workflow_dispatch）
# 产物：发布到 release-vanilla 分支的 zip

on:
  push:
    branches: [ vanilla ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_REPO: "https://github.com/bcggxx/android_kernel_xiaomi_moon_sm8250"
  KERNEL_BRANCH: "main"

jobs:
  build:
    name: Build moon VANILLA
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (workflow only)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip bc bison flex gperf \
            build-essential libssl-dev libelf-dev cpio lz4 lzop xz-utils \
            python3 python-is-python3 device-tree-compiler p7zip-full

      - name: Install AOSP clang-r416183b
        run: |
          set -e
          wget -c --tries=10 --waitretry=5 --retry-connrefused -O clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/428d18d9732aa7ebfcaed87a582d86155db878d4/clang-r416183b.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/clang"
          tar -xzf clang.tar.gz -C "$GITHUB_WORKSPACE/clang"
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Clone moon kernel
        run: |
          set -e
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          cd kernel && echo "kernel HEAD: $(git rev-parse HEAD)"; head -n 5 Makefile

      - name: Append moon xiaomi.config to defconfig (no KSU)
        working-directory: kernel
        run: |
          set -e
          DEF=arch/arm64/configs/vendor/pipa_user_defconfig
          cat arch/arm64/configs/xiaomi.config >> "$DEF"
          echo "--- tail defconfig ---"; tail -n 20 "$DEF"

      - name: Build & pack (moon build.sh + AnyKernel3)
        working-directory: kernel
        run: |
          set -e
          bash build.sh

      - name: Rename artifact
        working-directory: kernel
        run: |
          set -e
          f=$(ls Kernel_*.zip 2>/dev/null | head -n1)
          [ -n "$f" ] || { echo "no zip"; ls -la; exit 1; }
          mv "$f" "../moon-vanilla-${GITHUB_RUN_NUMBER}.zip"
          ls -la ../*.zip

      - name: Publish to release-vanilla branch
        if: success()
        run: |
          set +e
          mkdir -p /tmp/rel && cp moon-vanilla-*.zip /tmp/rel/
          cd /tmp/rel
          git init -q -b release-vanilla
          git config user.name ci; git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git -c commit.gpgsign=false commit -q -m "vanilla zip run ${{ github.run_number }}"
          git push -f origin release-vanilla
